[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "fastdateinfer"
dynamic = ["version"]
description = "Fast Rust date-format inference: detect the strptime format of a column of dates, resolving ambiguous DD/MM vs MM/DD by consensus. A 270x-faster, maintained alternative to dateinfer / hi-dateinfer."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Ugochukwu Onyebuchi", email = "pyvinci@gmail.com"}
]
keywords = ["date", "datetime", "date-format", "format-inference", "strptime", "strftime", "dateinfer", "dateutil", "dayfirst", "parsing", "pandas", "polars", "rust"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: General",
]

[project.urls]
Homepage = "https://github.com/coledrain/fastdateinfer"
Repository = "https://github.com/coledrain/fastdateinfer"
Documentation = "https://github.com/coledrain/fastdateinfer#readme"

[tool.maturin]
features = ["python"]
python-source = "python"
module-name = "fastdateinfer"
