[package]
name = "fastdateinfer"
version = "0.3.1"
edition = "2021"
rust-version = "1.70"
description = "Fast, consensus-based date-format inference — detects the strptime format of a column of dates and resolves ambiguous DD/MM vs MM/DD from examples. A fast, maintained alternative to dateinfer / hi-dateinfer."
license = "MIT"
repository = "https://github.com/coledrain/fastdateinfer"
authors = ["Ugochukwu Onyebuchi <pyvinci@gmail.com>"]
keywords = ["date", "datetime", "dateinfer", "strptime", "parsing"]
categories = ["date-and-time", "parsing"]

[lib]
name = "fastdateinfer"
crate-type = ["lib", "cdylib"]

[dependencies]
thiserror = "1.0"
rustc-hash = "2.0"
smallvec = "1.13"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "inference"
harness = false

[dependencies.rayon]
version = "1.10"
optional = true

[features]
default = []
python = ["pyo3", "rayon"]

[dependencies.pyo3]
version = "0.28"
features = ["extension-module"]
optional = true
